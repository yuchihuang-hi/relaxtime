<!DOCTYPE html>
<html lang="zh-Hant">
<head>
       <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relax Station Pro - Notion Style</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #37352f;
            --border-color: #e9e9e8;
            --hover-color: #f1f1f0;
            --accent-color: #eb5757; 
            --progress-bg: #eeeeee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; padding-bottom: 120px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        h1 { font-size: 1.6rem; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        .section { margin-bottom: 32px; }
        .section-title { font-size: 0.85rem; color: rgba(55, 53, 47, 0.5); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* 卡片工具標籤樣式 */
        .tool-tag {
            font-size: 0.7rem;
            font-weight: 600;
            color: #444;
            background: #fff;
            border: 1px solid #ddd;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .card:hover { background-color: var(--hover-color); }
        .card.selected { border: 2px solid var(--text-color); background-color: #fafafa; }
        .card.selected::after { content: ""; font-family: "Phosphor"; position: absolute; right: 15px; font-weight: bold; }

        /* 排序清單樣式 */
        .order-item {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 8px 12px;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .order-controls { margin-left: auto; display: flex; gap: 10px; }
        .order-btn { cursor: pointer; opacity: 0.6; padding: 4px; }
        .order-btn:hover { opacity: 1; background: #eee; border-radius: 4px; }

        /* 剩餘 UI 保持一致... (省略重複的 CSS) */
        #timer-ui { display: none; text-align: center; padding: 25px; border: 2px solid var(--text-color); border-radius: 12px; margin-bottom: 24px; background: white; position: sticky; top: 10px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .progress-container { width: 100%; height: 6px; background: var(--progress-bg); border-radius: 3px; margin: 15px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--text-color); transition: width 0.3s ease; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.8rem; color: #666; }
        .time-num { font-size: 4.5rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 5px 0; }
        .side-indicator { font-size: 1.1rem; font-weight: 800; color: white; background: var(--accent-color); padding: 2px 12px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
        .btn { padding: 12px; border: 1px solid var(--text-color); background: white; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
        .btn-black { background: var(--text-color); color: white; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .save-area { margin-top: 15px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px dashed #ccc; }
        .illustration-box { background: #fafafa; border-radius: 12px; height: 180px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .illustration-box svg { height: 90%; }
        .hidden { display: none !important; }
        .muscle-tag { font-size: 0.75rem; color: #666; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="ph ph-circle-dashed"></i> 肌肉放鬆站</h1>
    </header>

    <div id="timer-ui">
        <div class="stats-grid">
            <div id="stat-count">剩餘動作: --</div>
            <div id="stat-total-time">預計剩餘: --</div>
        </div>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div class="illustration-box" id="illustration-viewer"></div>
        <div id="side-label" class="side-indicator"></div>
        <h2 id="current-move-name">動作名稱</h2>
        <p id="current-muscle-info" style="font-size: 0.85rem; opacity: 0.6;"></p>
        <div class="time-num" id="timer">60</div>
        <div class="btn-group">
            <button class="btn" onclick="toggleTimer()" id="play-btn">暫停</button>
            <button class="btn" onclick="earlyFinish()" id="next-btn">提早完成</button>
            <button class="btn" onclick="stopSession()" style="color:var(--accent-color); border-color:var(--accent-color)">停止</button>
        </div>
    </div>

    <div id="main-content">
        <div class="section">
            <p class="section-title">我的組合 (內建 & 收藏)</p>
            <div id="my-favorites-list"></div>
        </div>

        <div class="section">
            <p class="section-title">選擇放鬆部位 (點擊選取)</p>
            <div id="move-library-ui"></div>
            
            <div class="save-area" id="selection-panel" style="display:none;">
                <p class="section-title" style="margin-top:0;">調整順序</p>
                <div id="sortable-list" style="margin-bottom: 15px;"></div>
                
                <button class="btn btn-black" onclick="prepareQueueAndStart()">開始自選組合 (<span id="select-count">0</span>)</button>
                <button class="btn" style="margin-top:8px;" onclick="saveCurrentAsFavorite()">儲存此組合</button>
            </div>
        </div>
    </div>
</div>

<script>
    const moveLib = [
        { id: 'neck', name: '頸部放鬆', muscle: '斜方肌', tool: '按摩球/手', toolIcon: 'ph- كرة', side: true, icon: 'ph-circle-wavy' },
        { id: 'chest', name: '胸部開展', muscle: '胸大肌', tool: '按摩球', toolIcon: 'ph- كرة', side: true, icon: 'ph-circle' },
        { id: 'pectoralis_minor', name: '胸小肌舒緩', muscle: '胸部深層', tool: '按摩球', toolIcon: 'ph- كرة', side: true, icon: 'ph-dot-outline' },
        { id: 'rhomboid', name: '菱形肌', muscle: '上背夾骨', tool: '按摩球', toolIcon: 'ph- كرة', side: true, icon: 'ph-circle-dashed' },
        { id: 'waist', name: '左右腰部', muscle: '腰方肌/腰側', tool: '按摩球', toolIcon: 'ph- كرة', side: true, icon: 'ph-vignette' },
        { id: 'lumbars', name: '下背舒緩', muscle: '豎脊肌', tool: '按摩球', toolIcon: 'ph- كرة', side: false, icon: 'ph-record' },
        { id: 'glute', name: '臀部放鬆', muscle: '臀大肌/梨狀肌', tool: '按摩球', toolIcon: 'ph- كرة', side: true, icon: 'ph-circle-half' },
        { id: 'thigh_f', name: '大腿前側', muscle: '股四頭肌', tool: '滾筒', toolIcon: 'ph-cylinder', side: true, icon: 'ph-circle-notch' },
        { id: 'thigh_i', name: '大腿內側', muscle: '內收肌群', tool: '滾筒', toolIcon: 'ph-cylinder', side: true, icon: 'ph-aperture' },
        { id: 'thigh_b', name: '大腿後側', muscle: '腿後肌群', tool: '滾筒', toolIcon: 'ph-cylinder', side: true, icon: 'ph-circle-half-tilt' },
        { id: 'calf', name: '小腿放鬆', muscle: '腓腸肌', tool: '滾筒/球', toolIcon: 'ph-cylinder', side: true, icon: 'ph-sphere' }
    ];

    let selectedIdsOrder = []; // 改用陣列儲存順序
    let currentQueue = []; 
    let currentIndex = 0;
    let timeLeft = 60;
    let timerId = null;

    function init() {
        const libUI = document.getElementById('move-library-ui');
        libUI.innerHTML = moveLib.map(m => `
            <div class="card" id="card-${m.id}" onclick="toggleSelect('${m.id}')">
                <i class="ph ${m.icon}"></i>
                <div class="card-info" style="flex:1">
                    <div style="display:flex; align-items:center;">
                        <span class="tool-tag"><i class="${m.tool.includes('滾筒')?'ph-cylinder':'ph-basketball'}"></i> ${m.tool}</span>
                        <strong>${m.name}</strong>
                    </div>
                    <span class="muscle-tag">${m.muscle} | ${m.side ? '左右分開' : '單次'}</span>
                </div>
            </div>
        `).join('');
        renderFavorites();
    }

    function toggleSelect(id) {
        const index = selectedIdsOrder.indexOf(id);
        if (index > -1) {
            selectedIdsOrder.splice(index, 1);
        } else {
            selectedIdsOrder.push(id);
        }
        updateUISelection();
    }

    function updateUISelection() {
        // 更新卡片狀態
        document.querySelectorAll('#move-library-ui .card').forEach(c => c.classList.remove('selected'));
        selectedIdsOrder.forEach(sid => {
            const el = document.getElementById(`card-${sid}`);
            if(el) el.classList.add('selected');
        });
        
        // 更新自選面板
        const panel = document.getElementById('selection-panel');
        panel.style.display = selectedIdsOrder.length > 0 ? 'block' : 'none';
        document.getElementById('select-count').innerText = selectedIdsOrder.length;

        // 渲染排序清單
        const sortList = document.getElementById('sortable-list');
        sortList.innerHTML = selectedIdsOrder.map((id, idx) => {
            const move = moveLib.find(m => m.id === id);
            return `
                <div class="order-item">
                    <span>${idx + 1}. ${move.name}</span>
                    <div class="order-controls">
                        <i class="ph ph-caret-up order-btn" onclick="moveItem(${idx}, -1); event.stopPropagation()"></i>
                        <i class="ph ph-caret-down order-btn" onclick="moveItem(${idx}, 1); event.stopPropagation()"></i>
                    </div>
                </div>
            `;
        }).join('');
    }

    function moveItem(idx, direction) {
        const newIdx = idx + direction;
        if (newIdx < 0 || newIdx >= selectedIdsOrder.length) return;
        const temp = selectedIdsOrder[idx];
        selectedIdsOrder[idx] = selectedIdsOrder[newIdx];
        selectedIdsOrder[newIdx] = temp;
        updateUISelection();
    }

    function prepareQueueAndStart(customIds = null) {
        const ids = customIds || selectedIdsOrder;
        currentQueue = [];
        
        ids.forEach(id => {
            const move = moveLib.find(m => m.id === id);
            if (move) {
                if (move.side) {
                    currentQueue.push({ ...move, label: '左側' });
                    currentQueue.push({ ...move, label: '右側' });
                } else {
                    currentQueue.push({ ...move, label: '雙側/中央' });
                }
            }
        });

        currentIndex = 0;
        document.getElementById('main-content').classList.add('hidden');
        document.getElementById('timer-ui').style.display = 'block';
        runMove();
    }

    // --- 以下為原始邏輯核心，保持不變以維持穩定性 ---

    function runMove() {
        if (currentIndex >= currentQueue.length) return finish();
        const move = currentQueue[currentIndex];
        document.getElementById('current-move-name').innerText = move.name;
        document.getElementById('side-label').innerText = move.label;
        document.getElementById('side-label').style.display = move.label ? 'inline-block' : 'none';
        document.getElementById('current-muscle-info').innerText = `${move.muscle} | 工具：${move.tool}`;
        document.getElementById('illustration-viewer').innerHTML = bodySvg(move.id);
        timeLeft = 60;
        updateTimerUI();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 5 && timeLeft > 0) playBeep(440);
            if (timeLeft <= 0) {
                playBeep(880);
                clearInterval(timerId);
                setTimeout(() => { currentIndex++; runMove(); }, 1000);
            }
            updateTimerUI();
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('timer').innerText = timeLeft;
        const progress = (currentIndex / currentQueue.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
        document.getElementById('stat-count').innerText = `進度: ${currentIndex + 1} / ${currentQueue.length}`;
        const totalSec = (currentQueue.length - currentIndex - 1) * 60 + timeLeft;
        document.getElementById('stat-total-time').innerText = `剩餘約 ${Math.floor(totalSec/60)} 分 ${totalSec%60} 秒`;
    }

    function earlyFinish() { clearInterval(timerId); currentIndex++; runMove(); }
    function toggleTimer() { 
        if (timerId) { clearInterval(timerId); timerId = null; document.getElementById('play-btn').innerText = '繼續'; } 
        else { startTimer(); document.getElementById('play-btn').innerText = '暫停'; }
    }
    function stopSession() { if(confirm("要結束練習嗎？")) location.reload(); }
    function finish() { alert("結束了！你最漂亮！"); location.reload(); }
    function playBeep(f){ try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.start();g.gain.exponentialRampToValueAtTime(0.00001,c.currentTime+0.1);setTimeout(()=>{o.stop();c.close()},150)}catch(e){}}

    function calculateTotalTime(ids) {
        let count = 0;
        ids.forEach(id => { const move = moveLib.find(m => m.id === id); if(move) count += (move.side ? 2 : 1); });
        return count;
    }

    function renderFavorites() {
        const defaultFavs = [
            { name: '上肢組合', ids: ['neck', 'chest', 'pectoralis_minor', 'rhomboid', 'waist', 'lumbars'] },
            { name: '下肢組合', ids: ['glute', 'thigh_f', 'thigh_i', 'calf'] }
        ];
        const userFavs = JSON.parse(localStorage.getItem('fav_v2') || '[]');
        const allFavs = [...defaultFavs, ...userFavs];
        document.getElementById('my-favorites-list').innerHTML = allFavs.map(f => `
            <div class="card" onclick="prepareQueueAndStart(['${f.ids.join("','")}'])">
                <i class="ph ph-play-circle" style="color:var(--accent-color)"></i>
                <div class="card-info">
                    <div>${f.name}</div>
                    <span class="muscle-tag">${f.ids.length} 部位 | 約 ${calculateTotalTime(f.ids)} 分鐘</span>
                </div>
            </div>
        `).join('');
    }

    function saveCurrentAsFavorite() {
        const name = prompt("組合名稱：", "我的日常組合");
        if (!name) return;
        const favs = JSON.parse(localStorage.getItem('fav_v2') || '[]');
        favs.push({ name, ids: [...selectedIdsOrder] });
        localStorage.setItem('fav_v2', JSON.stringify(favs));
        location.reload();
    }

    const bodySvg = (part) => {
        const highlights = {
            'neck': '<path d="M40 35 Q50 45 60 35" stroke="var(--accent-color)" stroke-width="4" fill="none" />',
            'chest': '<circle cx="35" cy="55" r="6" fill="var(--accent-color)" /><circle cx="65" cy="55" r="6" fill="var(--accent-color)" />',
            'pectoralis_minor': '<circle cx="32" cy="48" r="4" fill="var(--accent-color)" /><circle cx="68" cy="48" r="4" fill="var(--accent-color)" />',
            'rhomboid': '<path d="M40 55 L50 70 L60 55" stroke="var(--accent-color)" stroke-width="5" fill="none" />',
            'waist': '<rect x="30" y="85" width="8" height="15" fill="var(--accent-color)" /><rect x="62" y="85" width="8" height="15" fill="var(--accent-color)" />',
            'lumbars': '<rect x="42" y="90" width="16" height="15" fill="var(--accent-color)" />',
            'glute': '<circle cx="40" cy="115" r="10" fill="var(--accent-color)" /><circle cx="60" cy="115" r="10" fill="var(--accent-color)" />',
            'thigh_f': '<ellipse cx="40" cy="140" rx="8" ry="15" fill="var(--accent-color)" /><ellipse cx="60" cy="140" rx="8" ry="15" fill="var(--accent-color)" />',
            'thigh_i': '<ellipse cx="45" cy="145" rx="5" ry="12" fill="var(--accent-color)" /><ellipse cx="55" cy="145" rx="5" ry="12" fill="var(--accent-color)" />',
            'thigh_b': '<ellipse cx="40" cy="150" rx="8" ry="18" fill="rgba(235, 87, 87, 0.4)" />',
            'calf': '<ellipse cx="37" cy="180" rx="5" ry="12" fill="var(--accent-color)" /><ellipse cx="63" cy="180" rx="5" ry="12" fill="var(--accent-color)" />'
        };
        return `<svg viewBox="0 0 100 220" xmlns="http://www.w3.org/2000/svg"><g stroke="#37352f" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="50" cy="25" r="12" /> <path d="M50 37 L50 110" /> <path d="M50 45 L25 80" /> <path d="M50 45 L75 80" /> <path d="M50 110 L35 200" /> <path d="M50 110 L65 200" /> </g>${highlights[part] || ''}</svg>`;
    };

    init();
</script>

</body>
</html>
