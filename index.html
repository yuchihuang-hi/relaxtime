<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relax Station · Relax Station </title>
    <style>
        :root {
            --bg:           #fdfaf5;
            --primary:      #e28e8e;
            --primary-light:#f9d5d5;
            --water:        #a2d2ff;
            --break:        #b5e5c0;
            --break-dark:   #6dbf80;
            --card:         #ffffff;
            --text:         #5d5d5d;
            --text-dark:    #3a3a3a;
            --muted:        #b0b0b0;
            --shadow:       0 10px 30px rgba(0,0,0,0.05);
            --shadow-lg:    0 15px 50px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            min-height: 100vh;
            padding: 32px 20px 60px;
        }

        .page { max-width: 520px; margin: 0 auto; }

        /* ── 標題 ── */
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }
        .page-header p  { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

        /* ── 通用卡片 ── */
        .card {
            background: var(--card);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
        }

        /* ── 區塊標題 ── */
        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* ── 收藏 / 部位選取卡片 ── */
        .item-card {
            background: var(--card);
            border: 1.5px solid #f0ede8;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
        }
        .item-card:hover { background: #fdf7f2; border-color: var(--primary-light); }
        .item-card.selected {
            border-color: var(--primary);
            background: #fff8f8;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .item-icon {
            width: 38px; height: 38px;
            border-radius: 12px;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .item-card.selected .item-icon { background: var(--primary-light); }

        .item-info { flex: 1; }
        .item-name { font-size: 0.9rem; font-weight: 600; color: var(--text-dark); }
        .item-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

        .tool-pill {
            font-size: 0.7rem; font-weight: 600;
            background: var(--bg); color: var(--text);
            border: 1px solid #e8e4df;
            padding: 3px 8px; border-radius: 20px;
            white-space: nowrap; flex-shrink: 0;
        }

        .check-dot {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 1.5px solid #ddd;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: white;
            transition: all 0.2s;
        }
        .item-card.selected .check-dot {
            background: var(--primary);
            border-color: var(--primary);
        }
        .item-card.selected .check-dot::after { content: "✓"; }

        /* ── 排序清單 ── */
        .order-item {
            display: flex; align-items: center;
            background: var(--bg);
            border: 1px solid #f0ede8;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            font-size: 0.85rem; color: var(--text-dark);
        }
        .order-num {
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--primary-light); color: var(--primary);
            font-size: 0.7rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin-right: 10px; flex-shrink: 0;
        }
        .order-controls { margin-left: auto; display: flex; gap: 4px; }
        .order-btn {
            width: 26px; height: 26px; border-radius: 8px;
            border: none; background: none; cursor: pointer;
            color: var(--muted); font-size: 0.8rem;
            display: flex; align-items: center; justify-content: center;
            transition: 0.15s;
        }
        .order-btn:hover { background: var(--primary-light); color: var(--primary); }

        /* ── 按鈕 ── */
        .btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 16px;
            font-family: inherit; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.88; }
        .btn-ghost {
            background: none;
            border: 1.5px solid var(--primary-light);
            color: var(--primary);
        }
        .btn-ghost:hover { background: var(--primary-light); }
        .btn-danger {
            background: none;
            border: 1.5px solid #f5c6c6;
            color: var(--primary);
        }
        .btn-danger:hover { background: #fff0f0; }
        .btn-group { display: flex; gap: 8px; margin-top: 12px; }
        .btn-group .btn { margin: 0; }

        /* ── 收藏組合 play 標籤 ── */
        .play-badge {
            font-size: 0.7rem; font-weight: 700;
            background: var(--primary); color: white;
            padding: 3px 9px; border-radius: 20px;
            flex-shrink: 0;
        }

        /* ── 計時區（sticky 頂部） ── */
        #timer-ui {
            display: none;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            padding: 28px 24px;
            margin-bottom: 20px;
            position: sticky;
            top: 12px;
            z-index: 100;
            text-align: center;
        }

        /* 進度環 */
        .ring-wrap {
            width: 140px; height: 140px;
            position: relative;
            margin: 0 auto 18px;
        }
        .ring-wrap svg { transform: rotate(-90deg); }
        .ring-bg   { fill: none; stroke: var(--primary-light); stroke-width: 6; }
        .ring-fill { fill: none; stroke: var(--primary); stroke-width: 6;
                     stroke-linecap: round;
                     stroke-dasharray: 339.3; stroke-dashoffset: 339.3;
                     transition: stroke-dashoffset 0.8s ease; }
        .ring-time {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .ring-num { font-size: 2.8rem; font-weight: 300; color: var(--primary); line-height: 1; }
        .ring-label { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

        /* 動作名稱 & 側別 */
        .side-pill {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 0.75rem; font-weight: 700;
            padding: 3px 12px; border-radius: 20px;
            margin-bottom: 8px;
        }
        .move-name { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
        .move-sub  { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }

        /* 進度條 */
        .prog-bar-wrap {
            width: 100%; height: 5px;
            background: var(--primary-light);
            border-radius: 99px; overflow: hidden;
            margin-bottom: 8px;
        }
        #progress-bar {
            height: 100%; width: 0%;
            background: var(--primary);
            border-radius: 99px;
            transition: width 0.4s ease;
        }
        .prog-label {
            display: flex; justify-content: space-between;
            font-size: 0.72rem; color: var(--muted);
            margin-bottom: 16px;
        }

        /* 插圖框 */
        .illustration {
            width: 90px; height: 140px;
            margin: 0 auto 16px;
        }
        .illustration svg { width: 100%; height: 100%; }

        /* ── 慶祝橫幅 ── */
        #celebration {
            display: none;
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%);
            background: var(--break-dark);
            color: white; padding: 12px 28px;
            border-radius: 50px; z-index: 200;
            font-size: 0.9rem; white-space: nowrap;
            animation: fadeDown 0.4s ease;
            box-shadow: 0 8px 24px rgba(109,191,128,0.35);
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translate(-50%, -16px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }

        .hidden { display: none !important; }

        /* ── 小工具 pill for 工具提示 ── */
        .doing-pill {
            display: inline-flex; align-items: center; gap: 4px;
            background: var(--bg); border: 1px solid #ede9e4;
            border-radius: 20px; font-size: 0.72rem; color: var(--text);
            padding: 3px 10px; margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div id="celebration"></div>

<div class="page">
    <div class="page-header">
        <h1>🌿 Relax Station</h1>
        <p>選好部位，讓身體喘口氣</p>
    </div>

    <!-- ══ 計時 UI ══ -->
    <div id="timer-ui">

        <div class="prog-bar-wrap"><div id="progress-bar"></div></div>
        <div class="prog-label">
            <span id="stat-count">動作 1 / 1</span>
            <span id="stat-time">剩餘 -- 分</span>
        </div>

        <div class="illustration" id="illustration-viewer"></div>

        <div id="side-label" class="side-pill"></div>
        <div class="move-name" id="current-move-name">—</div>
        <div class="move-sub"  id="current-muscle-info"></div>

        <!-- 進度環計時 -->
        <div class="ring-wrap">
            <svg viewBox="0 0 114 114" width="140" height="140">
                <circle class="ring-bg"   cx="57" cy="57" r="54"/>
                <circle class="ring-fill" id="ring-fill" cx="57" cy="57" r="54"/>
            </svg>
            <div class="ring-time">
                <div class="ring-num" id="timer">60</div>
                <div class="ring-label">秒</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-ghost"   onclick="toggleTimer()" id="play-btn">暫停</button>
            <button class="btn btn-primary" onclick="earlyFinish()">提早完成 ›</button>
        </div>
        <button class="btn btn-danger" style="margin-top:8px;" onclick="stopSession()">停止練習</button>
    </div>

    <!-- ══ 主畫面 ══ -->
    <div id="main-content">

        <!-- 收藏組合 -->
        <div class="card">
            <div class="section-label">我的組合</div>
            <div id="my-favorites-list"></div>
        </div>

        <!-- 自選部位 -->
        <div class="card">
            <div class="section-label">選擇放鬆部位</div>
            <div id="move-library-ui"></div>
        </div>

        <!-- 自選確認面板 -->
        <div id="selection-panel" class="card" style="display:none;">
            <div class="section-label">調整順序</div>
            <div id="sortable-list" style="margin-bottom:16px;"></div>

            <button class="btn btn-primary" onclick="prepareQueueAndStart()">
                開始自選組合（<span id="select-count">0</span> 部位）
            </button>
            <button class="btn btn-ghost" style="margin-top:8px;" onclick="saveCurrentAsFavorite()">
                💾 儲存此組合
            </button>
        </div>

    </div><!-- /main-content -->
</div><!-- /page -->

<script>
    /* ══════════════════════════════════
       資料
    ══════════════════════════════════ */
    const moveLib = [
        { id:'neck',             name:'頸部放鬆',   muscle:'斜方肌',       tool:'按摩球 / 手', side:true,  emoji:'🧠' },
        { id:'chest',            name:'胸部開展',   muscle:'胸大肌',       tool:'按摩球',      side:true,  emoji:'💪' },
        { id:'pectoralis_minor', name:'胸小肌舒緩', muscle:'胸部深層',     tool:'按摩球',      side:true,  emoji:'🫁' },
        { id:'rhomboid',         name:'菱形肌',     muscle:'上背夾骨',     tool:'按摩球',      side:true,  emoji:'🔷' },
        { id:'waist',            name:'左右腰部',   muscle:'腰方肌 / 腰側', tool:'按摩球',      side:true,  emoji:'↔️' },
        { id:'lumbars',          name:'下背舒緩',   muscle:'豎脊肌',       tool:'按摩球',      side:false, emoji:'🪨' },
        { id:'glute',            name:'臀部放鬆',   muscle:'臀大肌 / 梨狀肌', tool:'按摩球',   side:true,  emoji:'🍑' },
        { id:'thigh_f',          name:'大腿前側',   muscle:'股四頭肌',     tool:'滾筒',        side:true,  emoji:'🦵' },
        { id:'thigh_i',          name:'大腿內側',   muscle:'內收肌群',     tool:'滾筒',        side:true,  emoji:'🔰' },
        { id:'thigh_b',          name:'大腿後側',   muscle:'腿後肌群',     tool:'滾筒',        side:true,  emoji:'🦵' },
        { id:'calf',             name:'小腿放鬆',   muscle:'腓腸肌',       tool:'滾筒 / 球',   side:true,  emoji:'🦶' },
    ];

    let selectedIdsOrder = [];
    let currentQueue = [], currentIndex = 0;
    let timeLeft = 60, totalTime = 60;
    let timerId = null;

    /* ══════════════════════════════════
       音效（Web Audio API）
    ══════════════════════════════════ */
    let audioCtx = null;
    function getCtx() { return audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)()); }
    function playTone(freq, duration = 0.12, gain = 0.35) {
        try {
            const ctx = getCtx();
            const osc = ctx.createOscillator();
            const g   = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = freq;
            g.gain.setValueAtTime(gain, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.start(); osc.stop(ctx.currentTime + duration + 0.02);
        } catch(e) {}
    }
    // 倒數提示（最後5秒）
    function playCountdown() { playTone(440, 0.08, 0.2); }
    // 換動作完成音（輕快兩聲）
    function playNext() {
        playTone(523, 0.15); setTimeout(() => playTone(659, 0.2), 170);
    }
    // 全部完成音（三聲上揚）
    function playFinish() {
        playTone(523, 0.18);
        setTimeout(() => playTone(659, 0.18), 200);
        setTimeout(() => playTone(784, 0.35), 400);
    }

    /* ══════════════════════════════════
       初始化
    ══════════════════════════════════ */
    function init() {
        const libUI = document.getElementById('move-library-ui');
        libUI.innerHTML = moveLib.map(m => `
            <div class="item-card" id="card-${m.id}" onclick="toggleSelect('${m.id}')">
                <div class="item-icon">${m.emoji}</div>
                <div class="item-info">
                    <div class="item-name">${m.name}</div>
                    <div class="item-meta">${m.muscle} · ${m.side ? '左右分開' : '單次'}</div>
                </div>
                <span class="tool-pill">${m.tool}</span>
                <div class="check-dot"></div>
            </div>
        `).join('');
        renderFavorites();
    }

    /* ══════════════════════════════════
       選取部位
    ══════════════════════════════════ */
    function toggleSelect(id) {
        const i = selectedIdsOrder.indexOf(id);
        i > -1 ? selectedIdsOrder.splice(i,1) : selectedIdsOrder.push(id);
        updateUISelection();
    }

    function updateUISelection() {
        document.querySelectorAll('#move-library-ui .item-card').forEach(c => c.classList.remove('selected'));
        selectedIdsOrder.forEach(sid => document.getElementById('card-'+sid)?.classList.add('selected'));

        const panel = document.getElementById('selection-panel');
        panel.style.display = selectedIdsOrder.length ? 'block' : 'none';
        document.getElementById('select-count').innerText = selectedIdsOrder.length;

        document.getElementById('sortable-list').innerHTML = selectedIdsOrder.map((id, idx) => {
            const m = moveLib.find(x => x.id === id);
            return `
                <div class="order-item">
                    <div class="order-num">${idx+1}</div>
                    <span>${m.emoji} ${m.name}</span>
                    <div class="order-controls">
                        <button class="order-btn" onclick="moveItem(${idx},-1);event.stopPropagation()">▲</button>
                        <button class="order-btn" onclick="moveItem(${idx}, 1);event.stopPropagation()">▼</button>
                    </div>
                </div>`;
        }).join('');
    }

    function moveItem(idx, dir) {
        const ni = idx + dir;
        if (ni < 0 || ni >= selectedIdsOrder.length) return;
        [selectedIdsOrder[idx], selectedIdsOrder[ni]] = [selectedIdsOrder[ni], selectedIdsOrder[idx]];
        updateUISelection();
    }

    /* ══════════════════════════════════
       收藏組合
    ══════════════════════════════════ */
    function calcDuration(ids) {
        return ids.reduce((s, id) => {
            const m = moveLib.find(x => x.id === id);
            return s + (m ? (m.side ? 2 : 1) : 0);
        }, 0);
    }

    function renderFavorites() {
        const defaults = [
            { name:'上肢舒緩', ids:['neck','chest','pectoralis_minor','rhomboid','waist','lumbars'] },
            { name:'下肢舒緩', ids:['glute','thigh_f','thigh_i','calf'] },
        ];
        const user = JSON.parse(localStorage.getItem('fav_v2') || '[]');
        const all  = [...defaults, ...user];
        document.getElementById('my-favorites-list').innerHTML = all.map((f,i) => `
            <div class="item-card" onclick="prepareQueueAndStart(['${f.ids.join("','")}'])">
                <div class="item-icon">🗂️</div>
                <div class="item-info">
                    <div class="item-name">${f.name}</div>
                    <div class="item-meta">${f.ids.length} 部位 · 約 ${calcDuration(f.ids)} 分鐘</div>
                </div>
                ${i >= defaults.length ? `<button onclick="deleteFav(${i - defaults.length});event.stopPropagation()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:0.8rem;flex-shrink:0;">✕</button>` : ''}
                <span class="play-badge">▶ 開始</span>
            </div>
        `).join('');
    }

    function saveCurrentAsFavorite() {
        const name = prompt('組合名稱：', '我的日常組合');
        if (!name) return;
        const favs = JSON.parse(localStorage.getItem('fav_v2') || '[]');
        favs.push({ name, ids: [...selectedIdsOrder] });
        localStorage.setItem('fav_v2', JSON.stringify(favs));
        showToast('✅ 組合已儲存！');
        renderFavorites();
    }

    function deleteFav(idx) {
        if (!confirm('刪除此組合？')) return;
        const favs = JSON.parse(localStorage.getItem('fav_v2') || '[]');
        favs.splice(idx, 1);
        localStorage.setItem('fav_v2', JSON.stringify(favs));
        renderFavorites();
    }

    /* ══════════════════════════════════
       建立動作佇列 & 啟動
    ══════════════════════════════════ */
    function prepareQueueAndStart(customIds = null) {
        const ids = customIds || selectedIdsOrder;
        currentQueue = [];
        ids.forEach(id => {
            const m = moveLib.find(x => x.id === id);
            if (!m) return;
            if (m.side) {
                currentQueue.push({ ...m, label:'左側' });
                currentQueue.push({ ...m, label:'右側' });
            } else {
                currentQueue.push({ ...m, label:'中央' });
            }
        });
        currentIndex = 0;
        document.getElementById('main-content').classList.add('hidden');
        document.getElementById('timer-ui').style.display = 'block';
        runMove();
    }

    /* ══════════════════════════════════
       計時核心
    ══════════════════════════════════ */
    function runMove() {
        if (currentIndex >= currentQueue.length) return finish();
        const m = currentQueue[currentIndex];
        document.getElementById('current-move-name').innerText  = m.name;
        document.getElementById('current-muscle-info').innerText = `${m.muscle} · 工具：${m.tool}`;
        document.getElementById('side-label').innerText         = m.label;
        document.getElementById('illustration-viewer').innerHTML = bodySvg(m.id);
        timeLeft = totalTime = 60;
        updateTimerUI();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerId);
        document.getElementById('play-btn').innerText = '暫停';
        timerId = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 5 && timeLeft > 0) playCountdown();
            updateTimerUI();
            if (timeLeft <= 0) {
                clearInterval(timerId); timerId = null;
                playNext();
                setTimeout(() => { currentIndex++; runMove(); }, 900);
            }
        }, 1000);
    }

    function updateTimerUI() {
        // 數字
        document.getElementById('timer').innerText = timeLeft;
        // 進度環（周長 ≈ 339.3）
        const pct = (totalTime - timeLeft) / totalTime;
        document.getElementById('ring-fill').style.strokeDashoffset = 339.3 * (1 - pct);
        // 進度條
        const barPct = (currentIndex / currentQueue.length) * 100;
        document.getElementById('progress-bar').style.width = barPct + '%';
        // 文字
        document.getElementById('stat-count').innerText = `動作 ${currentIndex+1} / ${currentQueue.length}`;
        const rem = (currentQueue.length - currentIndex - 1) * 60 + timeLeft;
        document.getElementById('stat-time').innerText  = `剩餘約 ${Math.floor(rem/60)} 分 ${rem%60} 秒`;
    }

    function toggleTimer() {
        if (timerId) {
            clearInterval(timerId); timerId = null;
            document.getElementById('play-btn').innerText = '繼續';
        } else {
            startTimer();
        }
    }

    function earlyFinish() { clearInterval(timerId); timerId = null; currentIndex++; runMove(); }

    function stopSession() {
        if (confirm('確定要停止練習嗎？')) location.reload();
    }

    function finish() {
        playFinish();
        showToast('🎉 完成了！你最漂亮！');
        setTimeout(() => location.reload(), 3000);
    }

    /* ══════════════════════════════════
       工具
    ══════════════════════════════════ */
    function showToast(text) {
